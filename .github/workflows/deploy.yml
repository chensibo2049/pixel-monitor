name: Deploy to Server

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '*.md'
      - '.gitignore'
  workflow_dispatch:

env:
  SERVER_PORT: 3086

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            # Clone or pull latest code
            DEPLOY_DIR="/opt/pixel-monitor"
            REPO_URL="https://github.com/chensibo2049/pixel-monitor.git"

            if [ -d "$DEPLOY_DIR/.git" ]; then
              cd $DEPLOY_DIR
              git fetch origin main
              git reset --hard origin/main
            else
              rm -rf $DEPLOY_DIR
              git clone $REPO_URL $DEPLOY_DIR
              cd $DEPLOY_DIR
            fi

            echo "Building Docker image..."
            docker build --platform linux/amd64 --no-cache -t pixel-monitor-campus:latest -f Dockerfile .

            echo "Restarting service..."
            docker compose down
            docker compose up -d

            echo "Waiting for service to be healthy..."
            sleep 15

            # Health check
            for i in {1..5}; do
              if curl -sf http://127.0.0.1:${{ env.SERVER_PORT }}/api/health > /dev/null; then
                echo "Service is healthy!"
                exit 0
              fi
              echo "Attempt $i/5 failed, retrying in 5s..."
              sleep 5
            done

            echo "Health check failed!"
            docker logs pixel-monitor-campus --tail 20
            exit 1

      - name: Verify deployment
        if: success()
        run: |
          echo "Deployment successful!"
          echo "URL: http://${{ secrets.SERVER_HOST }}:${{ env.SERVER_PORT }}"
