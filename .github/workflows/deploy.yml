name: Deploy to Server

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '*.md'
      - '.gitignore'
  workflow_dispatch:

env:
  IMAGE_NAME: pixel-monitor-campus
  SERVER_PORT: 3086

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (linux/amd64)
        run: |
          docker build \
            --platform linux/amd64 \
            --no-cache \
            -t ${{ env.IMAGE_NAME }}:latest \
            -f Dockerfile .

      - name: Save and compress image
        run: |
          docker save ${{ env.IMAGE_NAME }}:latest | gzip > deploy.tar.gz
          ls -lh deploy.tar.gz

      - name: Deploy to server via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --progress --timeout=300
          path: deploy.tar.gz
          remote_path: /opt/pixel-monitor/
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Load image and restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 5m
          script: |
            cd /opt/pixel-monitor
            echo "Loading Docker image..."
            docker load < deploy.tar.gz
            rm -f deploy.tar.gz

            echo "Restarting service..."
            docker compose down
            docker compose up -d

            echo "Waiting for service to be healthy..."
            sleep 15

            # Health check
            for i in {1..5}; do
              if curl -sf http://127.0.0.1:${{ env.SERVER_PORT }}/api/health > /dev/null; then
                echo "Service is healthy!"
                exit 0
              fi
              echo "Attempt $i/5 failed, retrying in 5s..."
              sleep 5
            done

            echo "Health check failed!"
            docker logs pixel-monitor-campus --tail 20
            exit 1

      - name: Verify deployment
        if: success()
        run: |
          echo "Deployment successful!"
          echo "Server: ${{ secrets.SERVER_HOST }}:${{ env.SERVER_PORT }}"
          echo "URL: http://${{ secrets.SERVER_HOST }}:${{ env.SERVER_PORT }}"

      - name: Cleanup
        if: always()
        run: rm -f deploy.tar.gz
